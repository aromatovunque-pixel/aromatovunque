name: Karaoke Maker (macOS)

on:
  push:
    paths:
      - "karaoke-maker/**"
      - ".github/workflows/karaoke-maker.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versione Swift
        run: swift --version
      - name: Compila l'app
        working-directory: karaoke-maker
        run: ./build.sh
      - name: Verifica automatica (rendering ed esportazione video)
        working-directory: karaoke-maker
        run: |
          "dist/Karaoke Maker.app/Contents/MacOS/KaraokeMaker" --selftest TestData/progetto-web.json selftest-out
          ls -la selftest-out
      - name: Avvio dell'interfaccia con un progetto
        working-directory: karaoke-maker
        run: |
          cp TestData/progetto-web.json /tmp/progetto-web.json
          open -a "$PWD/dist/Karaoke Maker.app" /tmp/progetto-web.json
          sleep 12
          pgrep -x KaraokeMaker
          screencapture -x selftest-out/screenshot-app.png || true
          osascript -e 'tell application "System Events" to keystroke "3" using command down' || true
          sleep 4
          screencapture -x selftest-out/screenshot-video.png || true
          pgrep -x KaraokeMaker
          pkill -x KaraokeMaker || true
      - name: Carica i risultati della verifica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            karaoke-maker/selftest-out/*.png
            karaoke-maker/selftest-out/*.lrc
            karaoke-maker/selftest-out/export-h264.mp4
      - name: Carica l'app
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeMaker-mac
          path: karaoke-maker/dist/KaraokeMaker-mac.zip
      - name: Pubblica la release "karaoke-maker-latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete karaoke-maker-latest --yes --cleanup-tag || true
          S=karaoke-maker/selftest-out
          cp $S/frame-scorrimento-riga2-meta.png anteprima-1-scorrimento.png
          cp $S/frame-parola-riga2-meta.png anteprima-2-parola-per-parola.png
          cp $S/frame-alternate-riga2-meta.png anteprima-3-righe-alternate.png
          cp $S/decoded-prores4444Alpha.png anteprima-4-trasparente.png
          cp $S/frame-verticale-riga2-meta.png anteprima-5-verticale.png
          cp $S/frame-scorrimento-intro.png anteprima-6-titolo.png
          cp $S/frame-scorrimento-countdown.png anteprima-7-conto-alla-rovescia.png
          cp $S/screenshot-app.png anteprima-0-app.png 2>/dev/null || true
          cp $S/screenshot-video.png anteprima-0-app-video.png 2>/dev/null || true
          gh release create karaoke-maker-latest karaoke-maker/dist/KaraokeMaker-mac.zip anteprima-*.png \
            --target "$GITHUB_SHA" --prerelease \
            --title "Karaoke Maker per Mac (ultima build)" \
            --notes "App per macOS 13 o successivo (Apple Silicon e Intel). Scarica KaraokeMaker-mac.zip, estrai e trascina Karaoke Maker in Applicazioni. Al primo avvio: clic destro → Apri."
